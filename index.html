<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#2f4a3a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="劣化調査">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<title>公共施設 劣化調査ノート</title>
<style>
:root{
  --bg:#f4f2ec; --card:#fff; --ink:#1f2622; --sub:#5d665f; --line:#d9d5ca;
  --pri:#2f4a3a; --pri-ink:#fff; --acc:#c46a2b; --chip:#ebe7dc; --chip-on:#2f4a3a;
  --danger:#a23b2a;
  font-family:"BIZ UDPGothic","BIZ UDGothic","Hiragino Sans","Hiragino Kaku Gothic ProN","Yu Gothic",system-ui,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);-webkit-text-size-adjust:100%}
body{padding-bottom:calc(96px + env(safe-area-inset-bottom))}
header{position:sticky;top:0;z-index:10;background:var(--pri);color:var(--pri-ink);
  padding:calc(10px + env(safe-area-inset-top)) 14px 10px;display:flex;align-items:center;gap:10px}
header h1{font-size:17px;margin:0;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:700}
header button{background:transparent;border:1px solid rgba(255,255,255,.5);color:#fff;border-radius:8px;padding:7px 11px;font-size:15px}
main{max-width:860px;margin:0 auto;padding:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:12px}
.muted{color:var(--sub);font-size:13px}
h2{font-size:15px;margin:4px 0 10px;color:var(--sub);font-weight:700;letter-spacing:.04em}
label.f{display:block;font-size:13px;color:var(--sub);margin:12px 0 5px;font-weight:700}
input[type=text],input[type=date],input[type=number],textarea,select{
  width:100%;font-size:16px;padding:11px 12px;border:1px solid var(--line);border-radius:9px;background:#fff;color:var(--ink);font-family:inherit}
textarea{min-height:110px;line-height:1.55;resize:vertical}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:none;border-radius:10px;
  padding:13px 16px;font-size:16px;font-weight:700;background:var(--chip);color:var(--ink);font-family:inherit;cursor:pointer}
.btn.pri{background:var(--pri);color:#fff}
.btn.acc{background:var(--acc);color:#fff}
.btn.ghost{background:transparent;border:1px solid var(--line)}
.btn.danger{background:transparent;color:var(--danger);border:1px solid var(--danger)}
.btn.wide{width:100%}
.btn.sm{padding:10px 8px;font-size:14px}
.btn:disabled{opacity:.45}
.row{display:flex;gap:8px;flex-wrap:wrap}
.row>.btn{flex:1}
.list-item{display:flex;align-items:center;gap:12px;padding:13px 4px;border-bottom:1px solid var(--line);cursor:pointer}
.list-item:last-child{border-bottom:none}
.list-item .no{font-family:ui-monospace,Menlo,monospace;font-size:13px;background:var(--chip);border-radius:6px;padding:3px 7px;color:var(--sub)}
.list-item .name{flex:1;font-size:16px;font-weight:700}
.list-item .cnt{font-size:13px;color:var(--sub)}
.chips{display:flex;flex-wrap:wrap;gap:7px}
.chip{border:1px solid var(--line);background:var(--chip);border-radius:999px;padding:9px 13px;font-size:15px;font-family:inherit;color:var(--ink);cursor:pointer}
.chip.on{background:var(--chip-on);color:#fff;border-color:var(--chip-on)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.thumb{background:var(--card);border:1px solid var(--line);border-radius:10px;overflow:hidden;cursor:pointer}
.thumb img{width:100%;aspect-ratio:4/3;object-fit:cover;display:block;background:#ccc}
.thumb .cap{padding:7px 8px;font-size:12.5px;line-height:1.4}
.thumb .cap b{font-family:ui-monospace,Menlo,monospace;font-size:12px;color:var(--acc)}
.photo-main{width:100%;border-radius:10px;display:block;background:#ccc;max-height:58vh;object-fit:contain}
.fab{position:fixed;left:0;right:0;bottom:0;padding:12px 14px calc(12px + env(safe-area-inset-bottom));
  background:linear-gradient(to top,var(--bg) 70%,rgba(244,242,236,0));z-index:9}
.fab .inner{max-width:860px;margin:0 auto;display:flex;gap:8px}
.fab .btn{flex:1;padding:16px;font-size:17px}
.toast{position:fixed;left:50%;bottom:110px;transform:translateX(-50%);background:#222;color:#fff;padding:10px 16px;border-radius:10px;font-size:14px;z-index:50;opacity:0;transition:opacity .2s;pointer-events:none;max-width:90vw}
.toast.show{opacity:.92}
.empty{text-align:center;color:var(--sub);padding:28px 10px;font-size:14px;line-height:1.7}
.hint{font-size:12.5px;color:var(--sub);margin-top:6px;line-height:1.5}
.sel-bar{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px}
.badge{display:inline-block;font-size:11.5px;background:var(--chip);border-radius:5px;padding:1px 6px;margin:2px 3px 0 0}
dialog{border:none;border-radius:14px;padding:0;max-width:520px;width:92vw}
dialog::backdrop{background:rgba(0,0,0,.4)}
dialog .dbody{padding:16px}
.hidden{display:none!important}
</style>
</head>
<body>
<header>
  <button id="backBtn" class="hidden" aria-label="戻る">‹ 戻る</button>
  <h1 id="title">劣化調査ノート</h1>
  <button id="menuBtn">出力・設定</button>
</header>
<main id="view"></main>
<div class="fab hidden" id="fab"><div class="inner" id="fabInner"></div></div>
<div class="toast" id="toast"></div>
<dialog id="dlg"><div class="dbody">
  <div style="font-weight:700;font-size:17px;margin-bottom:6px" id="dlgTitle">✓ 出力の準備ができました</div>
  <div class="muted" id="dlgName" style="word-break:break-all"></div>
  <div class="row" style="margin-top:16px">
    <button class="btn ghost" id="dlgClose" style="flex:0 0 auto">閉じる</button>
    <button class="btn pri" id="dlgShare">📤 保存・共有</button>
  </div>
  <div class="hint" id="dlgHint"></div>
</div></dialog>

<input type="file" id="camInput" accept="image/*" capture="environment" class="hidden">
<input type="file" id="libInput" accept="image/*" multiple class="hidden">
<input type="file" id="csvInput" accept=".csv,text/csv,text/plain" class="hidden">
<input type="file" id="repInput" accept="image/*" class="hidden">
<input type="file" id="bkInput" accept=".json,application/json" class="hidden">

<script src="vendor/exceljs.min.js" defer></script>
<script src="config.js"></script>
<script src="export.js"></script>
<script src="app.js"></script>
</body>
</html>
